# The skill repo's own CI (kept-host/skill; inert inside the kept monorepo,
# where GitHub reads only the root .github/). E09 AC1, AC3, AC4.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck skills/kept/scripts/publish.sh
      - run: bash -n skills/kept/scripts/publish.sh

  # `npx skills add` installs into Claude Code's and Codex's global folders.
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install from this checkout
        run: npx -y skills add "$GITHUB_WORKSPACE" --skill kept -g -a claude-code codex -y --copy
      - name: Check the installed files
        run: |
          for dir in "$HOME/.claude/skills/kept" "$HOME/.agents/skills/kept"; do
            cmp "$dir/SKILL.md" skills/kept/SKILL.md
            cmp "$dir/scripts/publish.sh" skills/kept/scripts/publish.sh
            echo "ok: $dir"
          done

  # One live keyless publish, replace and delete against kept's dev environment,
  # then a keyed one when the repository secret KEPT_DEV_API_KEY is set.
  live-dev:
    runs-on: ubuntu-latest
    env:
      KEPT_BASE_URL: https://kept-dev.xyz
      HAS_KEY: ${{ secrets.KEPT_DEV_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Publish, replace, delete
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME" site
          printf '<!doctype html><title>kept skill CI</title><h1>%s</h1>\n' "$GITHUB_SHA" > site/index.html
          script=skills/kept/scripts/publish.sh
          "$script" --model ci --tool github-actions site/index.html | grep -v '^manage_token:'
          slug="$(sed -n 's/.*"slug":"\([^"]*\)".*/\1/p' "$HOME/.kept/drafts.json")"
          test "$(stat -c %a "$HOME/.kept/drafts.json")" = 600
          printf '<!doctype html><title>kept skill CI</title><h1>%s v2</h1>\n' "$GITHUB_SHA" > site/index.html
          "$script" --replace "$slug" --prompt "CI replace" site
          "$script" delete "$slug"
      - name: Keyed publish and delete
        if: env.HAS_KEY == 'true'
        env:
          KEPT_API_KEY: ${{ secrets.KEPT_DEV_API_KEY }}
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/home-keyed"
          mkdir -p "$HOME"
          out="$(skills/kept/scripts/publish.sh --model ci site)"
          echo "$out"
          slug="$(printf '%s\n' "$out" | sed -n 's#^Live: *https://\([^.]*\)\..*#\1#p')"
          skills/kept/scripts/publish.sh delete --page "$slug"
