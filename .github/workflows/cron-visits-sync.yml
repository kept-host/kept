name: Cron — visits sync

# E06 task 009 (D8). The substrate and its reasoning are
# `cron-draft-reminder.yml`'s; the call is `cron-post.yml`.
#
# WHAT IT DOES: once a day, POST /api/cron/visits-sync, which reads the most
# recent complete UTC day's per-hostname request counts from Cloudflare's
# GraphQL Analytics API (`httpRequestsAdaptiveGroups`) and upserts
# `page_views_daily`. Visits are never counted per view — the serve path does
# not change. `workflow_dispatch` takes `days` (1–30) for the first-run
# backfill: run it once by hand per track with `days=30`.
#
# SCHEDULED BY `apps/scheduler` (D-88), not here. The scheduler Worker POSTs
# the route daily at 03:17 UTC (the previous UTC day is complete) on each track
# whose `CRON_JOBS` (apps/scheduler/wrangler.toml) lists `visits-sync`. This
# workflow is the manual button: a dispatch runs the track picked in `target`.
# The route needs `Zone → Analytics → Read` on that track's control-plane
# CLOUDFLARE_API_TOKEN (Railway); without it every run fails on Cloudflare's
# `authz` refusal, so list it for prod only once the prod token has it.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Track to run"
        required: true
        default: dev
        type: choice
        options: [dev, prod]
      days:
        description: "Most recent complete UTC days to sync (1–30). 30 = first-run backfill."
        required: false
        default: "1"

permissions:
  contents: read

jobs:
  dev:
    name: Sync visits (dev)
    if: ${{ inputs.target == 'dev' }}
    uses: ./.github/workflows/cron-post.yml
    with:
      environment: dev
      route: /api/cron/visits-sync
      days: ${{ inputs.days || '1' }}
    secrets: inherit

  prod:
    name: Sync visits (prod)
    if: ${{ inputs.target == 'prod' }}
    uses: ./.github/workflows/cron-post.yml
    with:
      environment: prod-cron
      route: /api/cron/visits-sync
      days: ${{ inputs.days || '1' }}
    secrets: inherit
