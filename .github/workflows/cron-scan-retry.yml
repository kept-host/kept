name: Cron — scan retry

# E07 §6.5, §6.12 (D6, D14, AC3, AC11, AC22). Re-runs failed page scans on the
# +5 min / +15 min / +1 h / +6 h / +24 h schedule, scans current versions that
# never got a `scans` row, mails the admins once a day when more than 20 scans
# failed in 24 h, and re-scans traffic spikes once per synced visits day. Pages
# stay live throughout. The substrate and its reasoning are
# `cron-draft-reminder.yml`'s; the call is `cron-post.yml`.
#
# SCHEDULED BY `apps/scheduler` (D-88), not here. The scheduler Worker POSTs
# the route every 12 minutes (:03, :15, :27, :39, :51) on each track whose
# `CRON_JOBS` (apps/scheduler/wrangler.toml) lists `scan-retry`. This workflow
# is the manual button: a dispatch runs the track picked in `target`.
# List it for prod once prod Railway has `OPENROUTER_API_KEY`.
#
# Its first runs on a track work through the pages published before E07 (50
# per run, newest first) — the same scans `admin:scan --unscanned` runs by hand.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Track to run"
        required: true
        default: dev
        type: choice
        options: [dev, prod]

permissions:
  contents: read

jobs:
  dev:
    name: Retry page scans (dev)
    if: ${{ inputs.target == 'dev' }}
    uses: ./.github/workflows/cron-post.yml
    with:
      environment: dev
      route: /api/cron/scan-retry
    secrets: inherit

  prod:
    name: Retry page scans (prod)
    if: ${{ inputs.target == 'prod' }}
    uses: ./.github/workflows/cron-post.yml
    with:
      environment: prod-cron
      route: /api/cron/scan-retry
    secrets: inherit
