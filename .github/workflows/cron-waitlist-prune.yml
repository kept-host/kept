name: Cron — waitlist prune

# E06a §3. Deletes waitlist rows that never confirmed (30 days after their last
# confirmation mail, unless the founding application is approved), legacy 0006
# rows that never confirmed, and expired rate-limit buckets. The substrate and
# its reasoning are `cron-draft-reminder.yml`'s; the call is `cron-post.yml`.
#
# SCHEDULED BY `apps/scheduler` (D-88), not here. The scheduler Worker POSTs
# the route daily at 04:41 UTC on each track whose `CRON_JOBS`
# (apps/scheduler/wrangler.toml) lists `waitlist-prune`. This workflow is the
# manual button: a dispatch runs the track picked in `target`.
# List it for prod after the prod Resend tracking check
# (docs/prod-release.md §5).

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Track to run"
        required: true
        default: dev
        type: choice
        options: [dev, prod]

permissions:
  contents: read

jobs:
  dev:
    name: Prune the waitlist (dev)
    if: ${{ inputs.target == 'dev' }}
    uses: ./.github/workflows/cron-post.yml
    with:
      environment: dev
      route: /api/cron/waitlist-prune
    secrets: inherit

  prod:
    name: Prune the waitlist (prod)
    if: ${{ inputs.target == 'prod' }}
    uses: ./.github/workflows/cron-post.yml
    with:
      environment: prod-cron
      route: /api/cron/waitlist-prune
    secrets: inherit
