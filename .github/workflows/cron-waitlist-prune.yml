name: Cron — waitlist prune

# E06a §3. Deletes waitlist rows that never confirmed (30 days after their last
# confirmation mail, unless the founding application is approved), legacy 0006
# rows that never confirmed, and expired rate-limit buckets. The substrate and
# its reasoning are `cron-draft-reminder.yml`'s; the call is `cron-post.yml`.
#
# OFF UNTIL SWITCHED ON, PER TRACK. A track's schedule runs only when its
# repository variable is `true` (like the visits sync), so merging this file
# deletes nothing until someone decides it should:
#   * dev  — `WAITLIST_PRUNE_ENABLED`
#   * prod — `PROD_WAITLIST_PRUNE_ENABLED` (environment `prod-cron`), set after
#     the prod Resend tracking check (docs/prod-release.md §5)
# A manual dispatch runs the track picked in `target`, enabled or not.

on:
  schedule:
    # 04:41 UTC daily — off the hour, away from the other two jobs.
    - cron: "41 4 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "Track to run"
        required: true
        default: dev
        type: choice
        options: [dev, prod]

permissions:
  contents: read

jobs:
  dev:
    name: Prune the waitlist (dev)
    if: ${{ (github.event_name == 'schedule' && vars.WAITLIST_PRUNE_ENABLED == 'true') || inputs.target == 'dev' }}
    uses: ./.github/workflows/cron-post.yml
    with:
      environment: dev
      route: /api/cron/waitlist-prune
    secrets: inherit

  prod:
    name: Prune the waitlist (prod)
    if: ${{ (github.event_name == 'schedule' && vars.PROD_WAITLIST_PRUNE_ENABLED == 'true') || inputs.target == 'prod' }}
    uses: ./.github/workflows/cron-post.yml
    with:
      environment: prod-cron
      route: /api/cron/waitlist-prune
    secrets: inherit
