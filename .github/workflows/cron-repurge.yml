name: Cron — repurge

# E07 §6.14 (D14, AC26, AC35). Replays every `pending_purges` row that is due:
# the delayed second purge a restart or redeploy lost, a first purge Cloudflare
# refused, and a `syncManifest` whose KV write failed (re-synced to the row as
# it stands, then purged). The substrate and its reasoning are
# `cron-draft-reminder.yml`'s; the call is `cron-post.yml`.
#
# SCHEDULED BY `apps/scheduler` (D-88), not here. The scheduler Worker POSTs
# the route every 12 minutes (:07, :19, :31, :43, :55) on each track whose
# `CRON_JOBS` (apps/scheduler/wrangler.toml) lists `repurge`. This workflow is
# the manual button: a dispatch runs the track picked in `target`.
#
# Dev KV is on the free plan (1k writes a day): a replayed row that names a site
# re-writes its manifest, so test runs that leave rows behind spend that quota.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Track to run"
        required: true
        default: dev
        type: choice
        options: [dev, prod]

permissions:
  contents: read

jobs:
  dev:
    name: Replay pending purges (dev)
    if: ${{ inputs.target == 'dev' }}
    uses: ./.github/workflows/cron-post.yml
    with:
      environment: dev
      route: /api/cron/repurge
    secrets: inherit

  prod:
    name: Replay pending purges (prod)
    if: ${{ inputs.target == 'prod' }}
    uses: ./.github/workflows/cron-post.yml
    with:
      environment: prod-cron
      route: /api/cron/repurge
    secrets: inherit
