name: Cron — repurge

# E07 §6.14 (D14, AC26, AC35). Replays every `pending_purges` row that is due:
# the delayed second purge a restart or redeploy lost, a first purge Cloudflare
# refused, and a `syncManifest` whose KV write failed (re-synced to the row as
# it stands, then purged). The substrate and its reasoning are
# `cron-draft-reminder.yml`'s; the call is `cron-post.yml`.
#
# OFF UNTIL SWITCHED ON, PER TRACK. A track's schedule runs only when its
# repository variable is `true`, so merging this file replays nothing until
# someone decides it should:
#   * dev  — `REPURGE_ENABLED`
#   * prod — `PROD_REPURGE_ENABLED` (environment `prod-cron`)
# A manual dispatch runs the track picked in `target`, enabled or not.
#
# Dev KV is on the free plan (1k writes a day): a replayed row that names a site
# re-writes its manifest, so test runs that leave rows behind spend that quota.

on:
  schedule:
    # Every 12 minutes, off the hour: :07, :19, :31, :43, :55.
    - cron: "7-59/12 * * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "Track to run"
        required: true
        default: dev
        type: choice
        options: [dev, prod]

permissions:
  contents: read

jobs:
  dev:
    name: Replay pending purges (dev)
    if: ${{ (github.event_name == 'schedule' && vars.REPURGE_ENABLED == 'true') || inputs.target == 'dev' }}
    uses: ./.github/workflows/cron-post.yml
    with:
      environment: dev
      route: /api/cron/repurge
    secrets: inherit

  prod:
    name: Replay pending purges (prod)
    if: ${{ (github.event_name == 'schedule' && vars.PROD_REPURGE_ENABLED == 'true') || inputs.target == 'prod' }}
    uses: ./.github/workflows/cron-post.yml
    with:
      environment: prod-cron
      route: /api/cron/repurge
    secrets: inherit
