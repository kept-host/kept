name: CI

# Validate-only: typecheck -> lint -> build -> e2e across the workspace.
# NO deploy here. "Merge = validate, tag = deploy" — tag-based dev/prod release
# automation lives in separate workflows and owns all cloud credentials. This
# workflow runs on fork PRs, so it must never reference a deploy secret or an
# `environment:`.

on:
  push:
    branches: ["develop", "main"]
  pull_request:
    branches: ["develop", "main"]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck / Lint / Build / Test
    runs-on: ubuntu-latest
    steps:
      # Must precede the local composite action below: `uses: ./...` can only
      # resolve once the repository is already on disk.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup workspace
        uses: ./.github/actions/setup

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      # Playwright boots `next dev` itself via the config's `webServer`. Still no
      # environment is supplied here, and that is deliberate: E04 task 005's
      # publish drills hit the real dev Neon branch, R2, KV and Worker, so they
      # SKIP when the store credentials are absent — which they always are on a
      # fork PR. The unit suite still runs its pure assertions. The CI-side
      # publish→serve canary, with an ephemeral database branch, is task 010's.
      - name: Install Playwright browsers
        run: pnpm --filter @kept/web exec playwright install --with-deps chromium

      - name: Test
        run: pnpm test
        env:
          CI: "true"
