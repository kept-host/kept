name: Mirror skill

# `skill/` here is the only source of the agent skill (E09 Q1). This pushes it,
# with its history, to the root of the public `kept-host/skill` repository,
# whose `main` is what `/install.sh`, skills.sh and the plugin marketplaces
# install. Nobody commits to the mirror: an edit there would be overwritten
# here and never reach the app's `/skill.md`. See `docs/agents.md`.
#
# `git subtree split` is deterministic, so every run fast-forwards the mirror.
# Auth is a deploy key with write access on `kept-host/skill` only; its private
# half is the `SKILL_MIRROR_DEPLOY_KEY` secret here.
#
# Pre-launch it follows `develop`. At launch (E14) switch the branch to `main`,
# so a curl install only gets released skill versions.

on:
  push:
    branches: ["develop"]
    paths: ["skill/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-skill
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror skill/ to kept-host/skill
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for subtree split)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Split skill/ and push to the mirror's main
        env:
          DEPLOY_KEY: ${{ secrets.SKILL_MIRROR_DEPLOY_KEY }}
        run: |
          if [ -z "${DEPLOY_KEY}" ]; then
            echo "::error::SKILL_MIRROR_DEPLOY_KEY is not set (docs/agents.md, mirror setup)."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "${DEPLOY_KEY}" > ~/.ssh/skill_mirror
          chmod 600 ~/.ssh/skill_mirror
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          git subtree split --prefix=skill -b skill-mirror
          GIT_SSH_COMMAND="ssh -i ~/.ssh/skill_mirror -o IdentitiesOnly=yes" \
            git push git@github.com:kept-host/skill.git skill-mirror:main
          echo "Mirrored $(git rev-parse --short skill-mirror) (from ${GITHUB_SHA::7})"
