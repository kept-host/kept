name: Mirror skill

# `skill/` here is the only source of the agent skill (E09 Q1). This copies it
# to the root of the public `kept-host/skill` repository, whose `main` is what
# `/install.sh`, skills.sh and the plugin marketplaces install. Nobody commits
# to the mirror: an edit there would be overwritten here and never reach the
# app's `/skill.md`. See `docs/agents.md`.
#
# Snapshots, not history: each run commits the current `skill/` on top of the
# mirror's `main` as "Sync from kept-host/kept@<sha>", so nothing from this
# repository's history (old commits, other paths) is ever published. The
# `reset` input replaces the mirror's history with one snapshot commit
# (force-push) — for when the mirror holds something it should not.
#
# Auth is a deploy key with write access on `kept-host/skill` only; its private
# half is the `SKILL_MIRROR_DEPLOY_KEY` secret here.
#
# Pre-launch it follows `develop`. At launch (E14) switch the branch to `main`,
# so a curl install only gets released skill versions.

on:
  push:
    branches: ["develop"]
    paths: ["skill/**"]
  workflow_dispatch:
    inputs:
      reset:
        description: "Replace the mirror's history with one snapshot commit (force-push)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mirror-skill
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror skill/ to kept-host/skill
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Commit the snapshot and push to the mirror's main
        env:
          DEPLOY_KEY: ${{ secrets.SKILL_MIRROR_DEPLOY_KEY }}
          RESET: ${{ inputs.reset == true }}
        run: |
          if [ -z "${DEPLOY_KEY}" ]; then
            echo "::error::SKILL_MIRROR_DEPLOY_KEY is not set (docs/agents.md, mirror setup)."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "${DEPLOY_KEY}" > ~/.ssh/skill_mirror
          chmod 600 ~/.ssh/skill_mirror
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/skill_mirror -o IdentitiesOnly=yes"
          remote=git@github.com:kept-host/skill.git
          mirror="${RUNNER_TEMP}/mirror"

          if [ "${RESET}" = "true" ]; then
            git init -q -b main "${mirror}"
          else
            git clone -q --depth 1 --branch main "${remote}" "${mirror}"
          fi
          rsync -a --delete --exclude .git skill/ "${mirror}/"

          cd "${mirror}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Mirror already matches skill/ at ${GITHUB_SHA::7}."
            exit 0
          fi
          git commit -q -m "Sync from kept-host/kept@${GITHUB_SHA::7}"
          if [ "${RESET}" = "true" ]; then
            git push -q --force "${remote}" main
          else
            git push -q "${remote}" main
          fi
          echo "Mirrored kept-host/kept@${GITHUB_SHA::7}"
