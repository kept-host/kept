name: Main PR source

# Every change reaches `main` through `develop`: PRs go to `develop`, a dev tag
# is deployed and tested, and a release is a `develop → main` PR followed by a
# `prod-v*` tag. This check fails any PR into `main` whose head is not this
# repository's `develop` branch. It only blocks once it is a required status
# check on `main` (Settings → Branches → main → "Main PR source").
#
# No checkout and no secrets: it reads the event payload only, so it is safe on
# fork PRs.

on:
  pull_request:
    branches: ["main"]

permissions: {}

jobs:
  source:
    name: Main PR source
    runs-on: ubuntu-latest
    steps:
      - name: Head must be develop
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "${HEAD_REPO}" != "${REPO}" ] || [ "${HEAD_REF}" != "develop" ]; then
            echo "::error::PRs into main must come from ${REPO}:develop (got ${HEAD_REPO}:${HEAD_REF}). Open the PR against develop instead."
            exit 1
          fi
          echo "OK: ${HEAD_REPO}:${HEAD_REF} → main"
