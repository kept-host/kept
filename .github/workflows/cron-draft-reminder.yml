name: Cron — draft reminder

# E05 task 011. Mails the owner of each anonymous draft (one that left a
# reminder address) once, about two days before it expires; at most
# `REMINDER_RUN_CAP` (40) a run, nearest expiry first.
#
# THE CRON SUBSTRATE (D-88, 2026-10-26) — every cron-*.yml shares it. A cron is
# an idempotent, capped control-plane route, POST /api/cron/<job> with
# `Authorization: Bearer CRON_SECRET`. Two things call it:
#   * `apps/scheduler`, a Cloudflare Worker with one every-minute trigger per
#     track, on the clock. Its schedule table is `apps/scheduler/src/jobs.ts`;
#     which jobs a track runs is `CRON_JOBS` in its wrangler.toml, so turning a
#     job on is a reviewed PR and a deploy.
#   * these workflows, by hand (`workflow_dispatch`, through `cron-post.yml`),
#     for a test or an incident.
#
#   WHY NOT A GITHUB `schedule:` (the substrate until 2026-10-26). Best-effort,
#     and on this repo far worse than "delayed by minutes": over 2026-10-19 →
#     10-26 it fired the 12-minute jobs about 5% of the time (median gap 4 h),
#     the hourly one 23%, and the dailies 4–6 h late.
#
#   WHY A SEPARATE WORKER, AND STILL NEVER A CRON IN `apps/edge`. The data
#     plane must never call the control plane: `apps/edge` reads R2 + KV and
#     nothing else, so a control-plane outage cannot take a hosted page
#     offline. That rule stands. `apps/scheduler` serves nothing, reads no
#     store and shares no code or deploy with `apps/edge`; if it breaks, only
#     the crons stop. It is free (one of the account's five free Cron
#     Triggers per track) and on time to the minute.
#
#   REJECTED — a Railway cron service. Cheap as a run-and-exit script, but runs
#     at least 5 minutes apart, drifts by minutes, and lives in a dashboard.
#
# Dev's CRON_JOBS leaves this job out: dev reminders mail test pages' owners
# and spend the shared Resend quota. Dispatch it by hand to test.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Track to run"
        required: true
        default: dev
        type: choice
        options: [dev, prod]

permissions:
  contents: read

jobs:
  dev:
    name: Send draft reminders (dev)
    if: ${{ inputs.target == 'dev' }}
    uses: ./.github/workflows/cron-post.yml
    with:
      environment: dev
      route: /api/cron/draft-reminder
    secrets: inherit

  prod:
    name: Send draft reminders (prod)
    if: ${{ inputs.target == 'prod' }}
    uses: ./.github/workflows/cron-post.yml
    with:
      environment: prod-cron
      route: /api/cron/draft-reminder
    secrets: inherit
