name: Cron — expire

# E07 §6.13 (D14, AC23). Turns every `live` draft past its `expires_at` into
# `expired`, one page at a time under the owner and row locks, and writes the
# `expired` manifest so the edge serves "This draft wasn't kept" (410). Kept
# pages and flagged drafts are never touched. The substrate and its reasoning
# are `cron-draft-reminder.yml`'s; the call is `cron-post.yml`. Two runs
# cannot overlap on the clock (an hour apart, each done in ~50 s); a manual run
# during a scheduled one is safe: each page is expired under its row locks.
#
# SCHEDULED BY `apps/scheduler` (D-88), not here. The scheduler Worker POSTs
# the route hourly at :23 on each track whose `CRON_JOBS`
# (apps/scheduler/wrangler.toml) lists `expire`. This workflow is the manual
# button: a dispatch runs the track picked in `target`.
#
# Dev KV is on the free plan (1k writes a day): every expired draft is one KV
# write, so the first run on a track with a backlog of overdue drafts spends
# that much quota (500 per batch, 50 s per run).

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Track to run"
        required: true
        default: dev
        type: choice
        options: [dev, prod]

permissions:
  contents: read

jobs:
  dev:
    name: Expire drafts (dev)
    if: ${{ inputs.target == 'dev' }}
    uses: ./.github/workflows/cron-post.yml
    with:
      environment: dev
      route: /api/cron/expire
    secrets: inherit

  prod:
    name: Expire drafts (prod)
    if: ${{ inputs.target == 'prod' }}
    uses: ./.github/workflows/cron-post.yml
    with:
      environment: prod-cron
      route: /api/cron/expire
    secrets: inherit
