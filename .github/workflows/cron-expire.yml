name: Cron — expire

# E07 §6.13 (D14, AC23). Turns every `live` draft past its `expires_at` into
# `expired`, one page at a time under the owner and row locks, and writes the
# `expired` manifest so the edge serves "This draft wasn't kept" (410). Kept
# pages and flagged drafts are never touched. The substrate and its reasoning
# are `cron-draft-reminder.yml`'s; the call is `cron-post.yml` (whose
# concurrency group keeps two runs from overlapping, edge case 14).
#
# OFF UNTIL SWITCHED ON, PER TRACK. A track's schedule runs only when its
# repository variable is `true`, so merging this file expires nothing until
# someone decides it should:
#   * dev  — `EXPIRE_ENABLED`
#   * prod — `PROD_EXPIRE_ENABLED` (environment `prod-cron`)
# A manual dispatch runs the track picked in `target`, enabled or not.
#
# Dev KV is on the free plan (1k writes a day): every expired draft is one KV
# write, so the first run on a track with a backlog of overdue drafts spends
# that much quota (500 per batch, 50 s per run).

on:
  schedule:
    # Hourly at :23 — off the hour and off the 12-minute jobs' minutes.
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "Track to run"
        required: true
        default: dev
        type: choice
        options: [dev, prod]

permissions:
  contents: read

jobs:
  dev:
    name: Expire drafts (dev)
    if: ${{ (github.event_name == 'schedule' && vars.EXPIRE_ENABLED == 'true') || inputs.target == 'dev' }}
    uses: ./.github/workflows/cron-post.yml
    with:
      environment: dev
      route: /api/cron/expire
    secrets: inherit

  prod:
    name: Expire drafts (prod)
    if: ${{ (github.event_name == 'schedule' && vars.PROD_EXPIRE_ENABLED == 'true') || inputs.target == 'prod' }}
    uses: ./.github/workflows/cron-post.yml
    with:
      environment: prod-cron
      route: /api/cron/expire
    secrets: inherit
