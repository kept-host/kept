name: Cron — purge

# E07 §6.13 (D14, AC24). Hard-deletes every page past `purge_after` in a
# purgeable status (expired, archived, removed, under_review, quarantined),
# skipping pages with an open appeal: releases its name (not for a moderation
# removal, whose ownerless hold stays), removes its manifest, deletes every
# version's R2 object, then the row. Clears reporters' names and emails 180 days
# after their report was resolved. Idempotent: a second run finds nothing. The
# substrate and its reasoning are `cron-draft-reminder.yml`'s; the call is
# `cron-post.yml` (whose concurrency group keeps runs from overlapping).
#
# OFF UNTIL SWITCHED ON, PER TRACK. A track's schedule runs only when its
# repository variable is `true`, so merging this file deletes nothing until
# someone decides it should:
#   * dev  — `PURGE_ENABLED`
#   * prod — `PROD_PURGE_ENABLED` (environment `prod-cron`)
# A manual dispatch runs the track picked in `target`, enabled or not.
#
# Dev KV is on the free plan (1k deletes a day): every purged page is one KV
# delete, so the first run on a track with a backlog spends that much quota.

on:
  schedule:
    # 05:29 UTC daily — off the hour, away from the other daily jobs.
    - cron: "29 5 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "Track to run"
        required: true
        default: dev
        type: choice
        options: [dev, prod]

permissions:
  contents: read

jobs:
  dev:
    name: Purge pages past their grace (dev)
    if: ${{ (github.event_name == 'schedule' && vars.PURGE_ENABLED == 'true') || inputs.target == 'dev' }}
    uses: ./.github/workflows/cron-post.yml
    with:
      environment: dev
      route: /api/cron/purge
    secrets: inherit

  prod:
    name: Purge pages past their grace (prod)
    if: ${{ (github.event_name == 'schedule' && vars.PROD_PURGE_ENABLED == 'true') || inputs.target == 'prod' }}
    uses: ./.github/workflows/cron-post.yml
    with:
      environment: prod-cron
      route: /api/cron/purge
    secrets: inherit
