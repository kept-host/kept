  <script>
    // Keeps casual visitors out; it's a family page, not a vault.
    const PASS_HASH = "26050b320de4b697e957c10d50ead62f4e0f75eb173d933a7cf0f59b1e402215";
    const CAPTION = "R3JhbmRtYSBSb3NhJ3MgODB0aCBiaXJ0aGRheSDigJQgdGhlIHdob2xlIE1vcmV0dGkgY2xhbiwgTGFrZXZpZXcgUGFyaywgSnVseSAyMDI2";

    async function sha256(text) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
      return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
    }

    function decodeCaption(b64) {
      const bytes = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
      return new TextDecoder().decode(bytes);
    }

    function unlock() {
      document.getElementById('gate').classList.add('hidden');
      document.getElementById('album').classList.remove('hidden');
      document.getElementById('caption').textContent = decodeCaption(CAPTION);
    }

    if (sessionStorage.getItem('album-unlocked') === '1') unlock();

    document.getElementById('gateForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const value = document.getElementById('code').value.trim().toLowerCase();
      if ((await sha256(value)) === PASS_HASH) {
        sessionStorage.setItem('album-unlocked', '1');
        unlock();
      } else {
        document.getElementById('gateMsg').textContent = 'Not quite — ask Mum for the passcode.';
      }
    });
  </script>
