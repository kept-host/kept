<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0f172a;
    color: #e2e8f0;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  h1 { margin: 0 0 12px; letter-spacing: 6px; color: #4ade80; }
  .hud { display: flex; gap: 32px; margin-bottom: 12px; font-size: 14px; }
  .hud span b { color: #facc15; }
  canvas {
    background: #111827;
    border: 2px solid #334155;
    border-radius: 8px;
    image-rendering: pixelated;
  }
  .overlay { margin-top: 14px; font-size: 13px; color: #94a3b8; text-align: center; }
  button {
    margin-top: 10px;
    background: #4ade80;
    border: none;
    color: #052e16;
    font-weight: bold;
    padding: 8px 20px;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
  }
</style>
</head>
<body>
  <h1>SNAKE</h1>
  <div class="hud">
    <span>Score: <b id="score">0</b></span>
    <span>High score: <b id="high">0</b></span>
  </div>
  <canvas id="board" width="400" height="400"></canvas>
  <div class="overlay">
    <div id="status">Press Space or tap Start to play. Arrow keys / WASD to steer.</div>
    <button id="start">Start</button>
  </div>

<script>
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const GRID = 20;
  const CELLS = canvas.width / GRID;
  const HIGH_KEY = 'snake.highscore';

  let snake, dir, nextDir, food, score, loop, speed;
  let high = Number(localStorage.getItem(HIGH_KEY) || 0);
  document.getElementById('high').textContent = high;

  function reset() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = { x: 1, y: 0 };
    nextDir = dir;
    score = 0;
    speed = 120;
    placeFood();
    updateScore();
  }

  function placeFood() {
    do {
      food = { x: Math.floor(Math.random() * CELLS), y: Math.floor(Math.random() * CELLS) };
    } while (snake.some(s => s.x === food.x && s.y === food.y));
  }

  function updateScore() {
    document.getElementById('score').textContent = score;
    if (score > high) {
      high = score;
      localStorage.setItem(HIGH_KEY, high);
      document.getElementById('high').textContent = high;
    }
  }

  function step() {
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    const hitWall = head.x < 0 || head.y < 0 || head.x >= CELLS || head.y >= CELLS;
    const hitSelf = snake.some(s => s.x === head.x && s.y === head.y);
    if (hitWall || hitSelf) return gameOver();

    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score += 10;
      updateScore();
      placeFood();
      if (speed > 60) {
        speed -= 4;
        clearInterval(loop);
        loop = setInterval(step, speed);
      }
    } else {
      snake.pop();
    }
    draw();
  }

  function draw() {
    ctx.fillStyle = '#111827';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#f87171';
    ctx.beginPath();
    ctx.arc(food.x * GRID + GRID / 2, food.y * GRID + GRID / 2, GRID / 2 - 3, 0, Math.PI * 2);
    ctx.fill();

    snake.forEach((s, i) => {
      ctx.fillStyle = i === 0 ? '#86efac' : '#22c55e';
      ctx.fillRect(s.x * GRID + 1, s.y * GRID + 1, GRID - 2, GRID - 2);
    });
  }

  function gameOver() {
    clearInterval(loop);
    loop = null;
    document.getElementById('status').textContent = `Game over! You scored ${score}. Press Space to try again.`;
    document.getElementById('start').textContent = 'Play again';
  }

  function start() {
    if (loop) return;
    reset();
    draw();
    document.getElementById('status').textContent = 'Good luck!';
    loop = setInterval(step, speed);
  }

  document.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (k === ' ') { e.preventDefault(); start(); return; }
    const map = {
      arrowup: { x: 0, y: -1 }, w: { x: 0, y: -1 },
      arrowdown: { x: 0, y: 1 }, s: { x: 0, y: 1 },
      arrowleft: { x: -1, y: 0 }, a: { x: -1, y: 0 },
      arrowright: { x: 1, y: 0 }, d: { x: 1, y: 0 },
    };
    const nd = map[k];
    if (!nd) return;
    e.preventDefault();
    // Prevent reversing straight into yourself
    if (nd.x === -dir.x && nd.y === -dir.y) return;
    nextDir = nd;
  });

  document.getElementById('start').addEventListener('click', start);

  reset();
  draw();
</script>
</body>
</html>
