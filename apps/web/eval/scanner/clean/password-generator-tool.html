<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strong Password Generator</title>
<style>
  :root {
    --bg: #f4f1ea;
    --card: #ffffff;
    --ink: #1d1d1f;
    --muted: #6b6b70;
    --accent: #3b5bdb;
    --border: #e2ded4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: 48px 16px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    width: 100%;
    max-width: 480px;
    box-shadow: 0 10px 30px rgba(0,0,0,.05);
  }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 24px; font-size: .9rem; }
  .output { display: flex; gap: 8px; }
  .output input {
    flex: 1;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 1.05rem;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: #fafaf7;
  }
  button {
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 10px;
    padding: 0 14px;
    cursor: pointer;
    font-size: .85rem;
  }
  button.primary {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
    width: 100%;
    padding: 12px;
    margin-top: 20px;
    font-size: 1rem;
  }
  .row { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; }
  input[type=range] { width: 100%; margin-top: 8px; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
  .opts label { display: flex; gap: 8px; align-items: center; font-size: .9rem; }
  .strength { height: 6px; border-radius: 3px; background: #eee; margin-top: 12px; overflow: hidden; }
  .strength div { height: 100%; transition: width .3s, background .3s; }
  .note { font-size: .78rem; color: var(--muted); margin-top: 18px; text-align: center; }
</style>
</head>
<body>
  <div class="card">
    <h1>Password Generator</h1>
    <p class="sub">Random, strong passwords using your browser's crypto API.</p>

    <div class="output">
      <input id="pw" type="password" readonly aria-label="Generated password">
      <button id="toggle">Show</button>
      <button id="copy">Copy</button>
    </div>
    <div class="strength"><div id="bar"></div></div>

    <div class="row"><strong>Length</strong><span id="lenVal">20</span></div>
    <input id="len" type="range" min="8" max="64" value="20">

    <div class="opts">
      <label><input type="checkbox" id="upper" checked> Uppercase (A–Z)</label>
      <label><input type="checkbox" id="lower" checked> Lowercase (a–z)</label>
      <label><input type="checkbox" id="digits" checked> Numbers (0–9)</label>
      <label><input type="checkbox" id="symbols" checked> Symbols (!@#…)</label>
      <label><input type="checkbox" id="ambig"> Avoid look-alikes (O0Il1)</label>
    </div>

    <button class="primary" id="gen">Generate new password</button>
    <p class="note">Everything happens locally — nothing is sent or stored anywhere.</p>
  </div>

<script>
  const sets = {
    upper: "ABCDEFGHIJKLMNOPQRSTUVWXYZ",
    lower: "abcdefghijklmnopqrstuvwxyz",
    digits: "0123456789",
    symbols: "!@#$%^&*()-_=+[]{};:,.<>?"
  };
  const ambiguous = /[O0Il1]/g;

  const el = id => document.getElementById(id);

  function randomInt(max) {
    // rejection sampling to avoid modulo bias
    const buf = new Uint32Array(1);
    const limit = Math.floor(0xffffffff / max) * max;
    do { crypto.getRandomValues(buf); } while (buf[0] >= limit);
    return buf[0] % max;
  }

  function generate() {
    let pool = "";
    const chosen = [];
    for (const key of Object.keys(sets)) {
      if (el(key).checked) {
        let chars = sets[key];
        if (el("ambig").checked) chars = chars.replace(ambiguous, "");
        pool += chars;
        chosen.push(chars);
      }
    }
    if (!pool) { el("pw").value = ""; return; }
    const len = +el("len").value;
    // guarantee at least one char from each selected set
    const out = chosen.map(s => s[randomInt(s.length)]);
    while (out.length < len) out.push(pool[randomInt(pool.length)]);
    for (let i = out.length - 1; i > 0; i--) {
      const j = randomInt(i + 1);
      [out[i], out[j]] = [out[j], out[i]];
    }
    el("pw").value = out.join("");
    const bits = len * Math.log2(pool.length);
    const pct = Math.min(100, bits / 128 * 100);
    el("bar").style.width = pct + "%";
    el("bar").style.background = bits < 50 ? "#e03131" : bits < 80 ? "#f59f00" : "#2f9e44";
  }

  el("len").addEventListener("input", e => { el("lenVal").textContent = e.target.value; generate(); });
  document.querySelectorAll(".opts input").forEach(cb => cb.addEventListener("change", generate));
  el("gen").addEventListener("click", generate);
  el("toggle").addEventListener("click", () => {
    const show = el("pw").type === "password";
    el("pw").type = show ? "text" : "password";
    el("toggle").textContent = show ? "Hide" : "Show";
  });
  el("copy").addEventListener("click", async () => {
    await navigator.clipboard.writeText(el("pw").value);
    el("copy").textContent = "Copied!";
    setTimeout(() => el("copy").textContent = "Copy", 1200);
  });

  generate();
</script>
</body>
</html>
