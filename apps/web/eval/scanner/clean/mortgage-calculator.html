<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mortgage Calculator</title>
  <style>
    :root { --brand: #0f766e; --ink: #0f172a; --muted: #64748b; --line: #e2e8f0; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #f8fafc; color: var(--ink); }
    .container { max-width: 1000px; margin: 0 auto; padding: 32px 20px; }
    h1 { margin: 0 0 4px; }
    .lead { color: var(--muted); margin: 0 0 28px; }
    .layout { display: grid; grid-template-columns: 340px 1fr; gap: 24px; }
    @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }
    .panel { background: white; border: 1px solid var(--line); border-radius: 14px; padding: 22px; }
    label { display: block; font-size: 13px; font-weight: 600; margin: 16px 0 6px; }
    label:first-child { margin-top: 0; }
    .field { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    .field span { padding: 0 10px; color: var(--muted); font-size: 14px; }
    .field input { border: none; padding: 10px; flex: 1; font-size: 15px; outline: none; width: 100%; }
    input[type=range] { width: 100%; accent-color: var(--brand); }
    .result { text-align: center; padding: 8px 0 18px; border-bottom: 1px solid var(--line); }
    .result .big { font-size: 42px; font-weight: 700; color: var(--brand); }
    .result small { color: var(--muted); }
    .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 18px; text-align: center; }
    .summary div b { display: block; font-size: 18px; }
    .summary div span { font-size: 12px; color: var(--muted); }
    .bar { display: flex; height: 12px; border-radius: 99px; overflow: hidden; margin-top: 18px; }
    .bar .p { background: var(--brand); } .bar .i { background: #f59e0b; }
    .legend { display: flex; gap: 16px; font-size: 12px; color: var(--muted); margin-top: 8px; }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: middle; }
    .table-wrap { margin-top: 24px; max-height: 420px; overflow-y: auto; border: 1px solid var(--line); border-radius: 10px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { position: sticky; top: 0; background: #f1f5f9; text-align: right; padding: 8px 10px; }
    td { text-align: right; padding: 6px 10px; border-top: 1px solid var(--line); }
    th:first-child, td:first-child { text-align: left; }
    .toggle { margin-top: 16px; font-size: 13px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🏠 Mortgage Calculator</h1>
    <p class="lead">Estimate your monthly repayment and see how every payment splits between principal and interest.</p>

    <div class="layout">
      <form class="panel" id="form">
        <label for="price">Home price</label>
        <div class="field"><span>$</span><input id="price" type="number" value="450000" min="0" step="1000"></div>

        <label for="down">Down payment: <span id="downPct">20</span>%</label>
        <input id="down" type="range" min="0" max="60" value="20">

        <label for="rate">Interest rate</label>
        <div class="field"><input id="rate" type="number" value="6.25" step="0.05" min="0"><span>% APR</span></div>

        <label for="term">Loan term</label>
        <div class="field">
          <select id="term" style="border:none;padding:10px;flex:1;font-size:15px;background:white">
            <option value="10">10 years</option><option value="15">15 years</option>
            <option value="20">20 years</option><option value="30" selected>30 years</option>
          </select>
        </div>

        <label for="extra">Extra monthly payment</label>
        <div class="field"><span>$</span><input id="extra" type="number" value="0" min="0" step="50"></div>
      </form>

      <section class="panel">
        <div class="result">
          <small>Monthly principal &amp; interest</small>
          <div class="big" id="monthly">$0</div>
          <small id="payoff"></small>
        </div>
        <div class="summary">
          <div><b id="loan">$0</b><span>Loan amount</span></div>
          <div><b id="interest">$0</b><span>Total interest</span></div>
          <div><b id="total">$0</b><span>Total paid</span></div>
        </div>
        <div class="bar"><div class="p" id="barP"></div><div class="i" id="barI"></div></div>
        <div class="legend"><span><i style="background:var(--brand)"></i>Principal</span><span><i style="background:#f59e0b"></i>Interest</span></div>

        <label class="toggle"><input type="checkbox" id="yearly" checked> Show yearly summary</label>
        <div class="table-wrap">
          <table><thead><tr><th id="periodHead">Year</th><th>Principal</th><th>Interest</th><th>Balance</th></tr></thead><tbody id="schedule"></tbody></table>
        </div>
      </section>
    </div>
  </div>

<script>
  const $ = id => document.getElementById(id);
  const money = n => n.toLocaleString('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 });

  function amortize(principal, annualRate, years, extra) {
    const r = annualRate / 100 / 12;
    const n = years * 12;
    const payment = r === 0 ? principal / n : principal * r / (1 - Math.pow(1 + r, -n));
    const rows = [];
    let balance = principal;
    for (let month = 1; balance > 0.005 && month <= n; month++) {
      const interest = balance * r;
      const principalPaid = Math.min(balance, payment - interest + extra);
      balance -= principalPaid;
      rows.push({ month, principal: principalPaid, interest, balance: Math.max(0, balance) });
    }
    return { payment, rows };
  }

  function calculate() {
    const price = +$('price').value || 0;
    const downPct = +$('down').value;
    $('downPct').textContent = downPct;
    const loan = price * (1 - downPct / 100);
    const { payment, rows } = amortize(loan, +$('rate').value || 0, +$('term').value, +$('extra').value || 0);

    const totalInterest = rows.reduce((s, r) => s + r.interest, 0);
    $('monthly').textContent = money(payment);
    $('loan').textContent = money(loan);
    $('interest').textContent = money(totalInterest);
    $('total').textContent = money(loan + totalInterest);
    const yrs = Math.floor(rows.length / 12), mos = rows.length % 12;
    $('payoff').textContent = `Paid off in ${yrs} years${mos ? ` ${mos} months` : ''}`;

    const pShare = loan / (loan + totalInterest || 1) * 100;
    $('barP').style.width = pShare + '%';
    $('barI').style.width = (100 - pShare) + '%';

    const yearly = $('yearly').checked;
    $('periodHead').textContent = yearly ? 'Year' : 'Month';
    let display = rows;
    if (yearly) {
      display = [];
      rows.forEach(r => {
        const y = Math.ceil(r.month / 12);
        if (!display[y - 1]) display[y - 1] = { month: y, principal: 0, interest: 0, balance: 0 };
        display[y - 1].principal += r.principal;
        display[y - 1].interest += r.interest;
        display[y - 1].balance = r.balance;
      });
    }
    $('schedule').innerHTML = display.map(r =>
      `<tr><td>${r.month}</td><td>${money(r.principal)}</td><td>${money(r.interest)}</td><td>${money(r.balance)}</td></tr>`).join('');
  }

  $('form').addEventListener('input', calculate);
  $('yearly').addEventListener('change', calculate);
  calculate();
</script>
</body>
</html>
