  <div id="lightbox" role="dialog" aria-modal="true">
    <button class="close" aria-label="Close">×</button>
    <button class="nav prev" aria-label="Previous">‹</button>
    <img id="lbImg" alt="" />
    <p id="lbCap"></p>
    <button class="nav next" aria-label="Next">›</button>
  </div>

  <footer>Photos by Nadia Kowalczyk · please ask before reusing</footer>

  <script>
    const shots = [...document.querySelectorAll('.shot')];
    const lb = document.getElementById('lightbox');
    const lbImg = document.getElementById('lbImg');
    const lbCap = document.getElementById('lbCap');
    let idx = 0;

    function open(i) {
      idx = (i + shots.length) % shots.length;
      const img = shots[idx].querySelector('img');
      lbImg.src = img.src;
      lbImg.alt = img.alt;
      lbCap.textContent = shots[idx].querySelector('figcaption').innerText.replace('\n', ' — ');
      lb.classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function close() {
      lb.classList.remove('open');
      document.body.style.overflow = '';
    }

    shots.forEach((s, i) => s.addEventListener('click', () => open(i)));
    lb.querySelector('.close').addEventListener('click', close);
    lb.querySelector('.prev').addEventListener('click', (e) => { e.stopPropagation(); open(idx - 1); });
    lb.querySelector('.next').addEventListener('click', (e) => { e.stopPropagation(); open(idx + 1); });
    lb.addEventListener('click', (e) => { if (e.target === lb) close(); });
    document.addEventListener('keydown', (e) => {
      if (!lb.classList.contains('open')) return;
      if (e.key === 'Escape') close();
      if (e.key === 'ArrowLeft') open(idx - 1);
      if (e.key === 'ArrowRight') open(idx + 1);
    });
  </script>
