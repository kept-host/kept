<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stash — my crypto holdings</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <div class="max-w-4xl mx-auto px-5 py-10">
    <div class="flex items-end justify-between flex-wrap gap-4">
      <div>
        <h1 class="text-3xl font-bold">Stash</h1>
        <p class="text-slate-500 text-sm">A dead-simple holdings log. Everything stays in this browser.</p>
      </div>
      <div class="text-right">
        <p class="text-xs uppercase tracking-wide text-slate-400">Total cost basis</p>
        <p id="total" class="text-3xl font-bold tabular-nums">$0.00</p>
        <p id="pnl" class="text-sm tabular-nums"></p>
      </div>
    </div>

    <form id="addForm" class="mt-8 bg-white rounded-2xl shadow-sm border border-slate-100 p-5 grid grid-cols-2 md:grid-cols-5 gap-3 items-end">
      <label class="text-xs text-slate-500 col-span-2 md:col-span-1">Coin
        <input id="coin" required placeholder="BTC" class="mt-1 w-full border rounded-lg px-3 py-2 uppercase text-slate-800" />
      </label>
      <label class="text-xs text-slate-500">Amount
        <input id="amount" type="number" step="any" min="0" required placeholder="0.25" class="mt-1 w-full border rounded-lg px-3 py-2 text-slate-800" />
      </label>
      <label class="text-xs text-slate-500">Buy price (USD)
        <input id="buy" type="number" step="any" min="0" required placeholder="42000" class="mt-1 w-full border rounded-lg px-3 py-2 text-slate-800" />
      </label>
      <label class="text-xs text-slate-500">Current price (USD)
        <input id="now" type="number" step="any" min="0" placeholder="optional" class="mt-1 w-full border rounded-lg px-3 py-2 text-slate-800" />
      </label>
      <button class="col-span-2 md:col-span-1 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg py-2.5 font-medium">Add</button>
    </form>

    <div class="mt-6 bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
      <table class="w-full text-sm">
        <thead class="bg-slate-50 text-slate-500 text-xs uppercase">
          <tr>
            <th class="text-left px-4 py-3">Coin</th>
            <th class="text-right px-4">Amount</th>
            <th class="text-right px-4">Avg buy</th>
            <th class="text-right px-4">Cost</th>
            <th class="text-right px-4">Now</th>
            <th class="text-right px-4">P/L</th>
            <th class="px-4"></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <p id="empty" class="text-center text-slate-400 py-10">No holdings yet — add your first one above.</p>
    </div>

    <div class="mt-6 flex gap-3 text-sm">
      <button id="exportBtn" class="px-4 py-2 rounded-lg border bg-white hover:bg-slate-50">Export CSV</button>
      <button id="clearBtn" class="px-4 py-2 rounded-lg border bg-white hover:bg-red-50 text-red-600">Clear all</button>
    </div>

    <p class="mt-10 text-xs text-slate-400">Stash never connects to a wallet or exchange. Prices are whatever you type in.</p>
  </div>

<script>
  const KEY = "stash.holdings.v1";
  const money = (n) => n.toLocaleString("en-US", { style: "currency", currency: "USD" });
  let holdings = [];
  try { holdings = JSON.parse(localStorage.getItem(KEY)) || []; } catch { holdings = []; }

  const save = () => localStorage.setItem(KEY, JSON.stringify(holdings));

  function render() {
    const tbody = document.getElementById("rows");
    tbody.innerHTML = "";
    let cost = 0, value = 0, hasNow = false;
    holdings.forEach((h, i) => {
      const c = h.amount * h.buy;
      const v = h.now ? h.amount * h.now : null;
      cost += c;
      if (v !== null) { value += v; hasNow = true; } else { value += c; }
      const pl = v !== null ? v - c : null;
      const tr = document.createElement("tr");
      tr.className = "border-t border-slate-100";
      tr.innerHTML = `
        <td class="px-4 py-3 font-semibold">${h.coin}</td>
        <td class="px-4 text-right tabular-nums">${h.amount}</td>
        <td class="px-4 text-right tabular-nums">${money(h.buy)}</td>
        <td class="px-4 text-right tabular-nums">${money(c)}</td>
        <td class="px-4 text-right tabular-nums">${h.now ? money(h.now) : "—"}</td>
        <td class="px-4 text-right tabular-nums ${pl === null ? "" : pl >= 0 ? "text-emerald-600" : "text-red-600"}">${pl === null ? "—" : (pl >= 0 ? "+" : "") + money(pl)}</td>
        <td class="px-4 text-right"><button data-i="${i}" class="del text-slate-300 hover:text-red-500">✕</button></td>`;
      tbody.appendChild(tr);
    });
    document.getElementById("empty").style.display = holdings.length ? "none" : "block";
    document.getElementById("total").textContent = money(cost);
    const pnl = document.getElementById("pnl");
    if (hasNow) {
      const diff = value - cost;
      pnl.textContent = `${diff >= 0 ? "▲" : "▼"} ${money(Math.abs(diff))} (${((diff / cost) * 100).toFixed(1)}%)`;
      pnl.className = `text-sm tabular-nums ${diff >= 0 ? "text-emerald-600" : "text-red-600"}`;
    } else pnl.textContent = "";
  }

  document.getElementById("addForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const coin = document.getElementById("coin").value.trim().toUpperCase();
    const amount = parseFloat(document.getElementById("amount").value);
    const buy = parseFloat(document.getElementById("buy").value);
    const now = parseFloat(document.getElementById("now").value) || null;
    holdings.push({ coin, amount, buy, now });
    save(); render(); e.target.reset();
  });

  document.getElementById("rows").addEventListener("click", (e) => {
    if (!e.target.classList.contains("del")) return;
    holdings.splice(+e.target.dataset.i, 1);
    save(); render();
  });

  document.getElementById("clearBtn").onclick = () => {
    if (confirm("Remove every holding?")) { holdings = []; save(); render(); }
  };

  document.getElementById("exportBtn").onclick = () => {
    const csv = ["coin,amount,buy_price,current_price", ...holdings.map(h => `${h.coin},${h.amount},${h.buy},${h.now ?? ""}`)].join("\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
    a.download = "stash-holdings.csv";
    a.click();
    URL.revokeObjectURL(a.href);
  };

  render();
</script>
</body>
</html>
