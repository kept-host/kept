<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spot the Phish — a 2-minute quiz</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-b from-sky-50 to-white min-h-screen flex items-center justify-center p-6 font-sans">
  <div class="w-full max-w-2xl">
    <div class="text-center mb-6">
      <h1 class="text-3xl font-extrabold text-slate-900">🎣 Spot the Phish</h1>
      <p class="text-slate-500 mt-1">Eight short scenarios. For each one, decide: phish or legit?</p>
    </div>

    <div id="quiz" class="bg-white rounded-3xl shadow-lg border border-slate-100 p-8">
      <div class="flex justify-between text-sm text-slate-400 mb-4">
        <span id="progress"></span>
        <span>Score: <b id="score" class="text-slate-700">0</b></span>
      </div>
      <div class="h-2 bg-slate-100 rounded-full mb-6 overflow-hidden"><div id="bar" class="h-full bg-sky-500 transition-all"></div></div>
      <p id="kind" class="text-xs uppercase tracking-wider text-sky-600 font-semibold"></p>
      <p id="scenario" class="text-lg text-slate-800 mt-2 leading-relaxed"></p>

      <div id="choices" class="grid grid-cols-2 gap-4 mt-8">
        <button data-a="phish" class="choice py-4 rounded-2xl border-2 border-rose-200 text-rose-700 font-bold hover:bg-rose-50">🚩 Phish</button>
        <button data-a="legit" class="choice py-4 rounded-2xl border-2 border-emerald-200 text-emerald-700 font-bold hover:bg-emerald-50">✅ Legit</button>
      </div>

      <div id="feedback" class="hidden mt-6 rounded-2xl p-5">
        <p id="verdict" class="font-bold"></p>
        <p id="why" class="text-sm mt-1"></p>
        <button id="next" class="mt-4 px-5 py-2 rounded-xl bg-slate-900 text-white text-sm font-semibold">Next →</button>
      </div>
    </div>

    <div id="result" class="hidden bg-white rounded-3xl shadow-lg border border-slate-100 p-10 text-center">
      <div id="emoji" class="text-6xl"></div>
      <h2 class="text-2xl font-extrabold mt-4">You scored <span id="final"></span> / 8</h2>
      <p id="summary" class="text-slate-500 mt-2"></p>
      <button id="restart" class="mt-6 px-6 py-3 rounded-xl bg-sky-600 text-white font-semibold">Try again</button>
    </div>

    <p class="text-center text-xs text-slate-400 mt-6">Made for the Brightwater Library digital-skills workshop.</p>
  </div>

<script>
  const QUESTIONS = [
    { kind: "Email", text: "Your bank emails: \"Unusual activity detected. Your account will be locked in 2 hours unless you verify your identity at the link below.\" The sender's address ends in a domain you've never seen.", answer: "phish", why: "A hard deadline plus an unfamiliar sender domain are two classic red flags. Your bank will never threaten to lock you out by email." },
    { kind: "Text message", text: "\"Your parcel is held at the depot. Pay a $1.99 redelivery fee within 24h.\" It links to a short URL.", answer: "phish", why: "Tiny fees are used to collect full card details. Couriers don't text short links asking for payment." },
    { kind: "Email", text: "You reset your streaming password a minute ago and receive an email from that service confirming the change. It doesn't ask you to click anything.", answer: "legit", why: "You started the action, the timing matches, and it asks nothing of you. That's what a genuine notification looks like." },
    { kind: "Web page", text: "A sign-in page has your email provider's exact logo and layout, but the address bar shows the provider's name followed by \"-secure-check\" and an unusual ending.", answer: "phish", why: "Copying a page is easy; copying a domain is not. Always read the real domain, right to left." },
    { kind: "Email", text: "Your manager emails from their personal address: \"In a meeting, can't talk. Please buy six $100 gift cards and send me the codes.\"", answer: "phish", why: "Gift-card requests and 'can't talk right now' are hallmarks of CEO-fraud scams. Confirm by phone." },
    { kind: "App notification", text: "Your work calendar shows an invite from a colleague you know, for a meeting you discussed yesterday, sent from their usual work address.", answer: "legit", why: "Known sender, expected content, no unusual request. Nothing here is asking you to hand anything over." },
    { kind: "Pop-up", text: "While browsing, a full-screen alert says your computer is infected and you must call a toll-free number immediately. It plays a loud sound.", answer: "phish", why: "Tech-support scams use fear and noise. Real antivirus software never asks you to phone a stranger." },
    { kind: "Email", text: "Your library emails a reminder that two books are due on Friday. It lists the titles and tells you to renew in the library app you already use.", answer: "legit", why: "It's specific, expected, and sends you to an app you already trust instead of a link." },
  ];

  let i = 0, score = 0, answered = false;
  const $ = (id) => document.getElementById(id);

  function show() {
    const q = QUESTIONS[i];
    answered = false;
    $("progress").textContent = `Question ${i + 1} of ${QUESTIONS.length}`;
    $("bar").style.width = `${(i / QUESTIONS.length) * 100}%`;
    $("kind").textContent = q.kind;
    $("scenario").textContent = q.text;
    $("feedback").classList.add("hidden");
    document.querySelectorAll(".choice").forEach((b) => (b.disabled = false, b.classList.remove("opacity-40")));
  }

  document.querySelectorAll(".choice").forEach((btn) =>
    btn.addEventListener("click", () => {
      if (answered) return;
      answered = true;
      const q = QUESTIONS[i];
      const right = btn.dataset.a === q.answer;
      if (right) score++;
      $("score").textContent = score;
      document.querySelectorAll(".choice").forEach((b) => { b.disabled = true; if (b !== btn) b.classList.add("opacity-40"); });
      const fb = $("feedback");
      fb.className = `mt-6 rounded-2xl p-5 ${right ? "bg-emerald-50 text-emerald-800" : "bg-rose-50 text-rose-800"}`;
      $("verdict").textContent = right ? "Correct!" : `Not quite — this one is ${q.answer}.`;
      $("why").textContent = q.why;
    })
  );

  $("next").onclick = () => {
    i++;
    if (i < QUESTIONS.length) return show();
    $("quiz").classList.add("hidden");
    $("result").classList.remove("hidden");
    $("final").textContent = score;
    $("emoji").textContent = score >= 7 ? "🏆" : score >= 5 ? "👍" : "🧐";
    $("summary").textContent = score >= 7
      ? "Sharp eyes. You'd be hard to fool."
      : "Good start. Remember: check the real domain, distrust deadlines, and never pay with gift cards.";
  };

  $("restart").onclick = () => {
    i = 0; score = 0;
    $("score").textContent = 0;
    $("result").classList.add("hidden");
    $("quiz").classList.remove("hidden");
    show();
  };

  show();
</script>
</body>
</html>
