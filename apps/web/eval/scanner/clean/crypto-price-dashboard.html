<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ticker Board — live crypto prices</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root { --bg: #0b0f17; --card: #121826; --line: #1e2738; --text: #e6ebf5; --muted: #8592a8; --up: #22c55e; --down: #ef4444; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 20px 32px; border-bottom: 1px solid var(--line); }
    header h1 { font-size: 20px; margin: 0; }
    header .meta { font-size: 13px; color: var(--muted); }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--up); margin-right: 6px; animation: pulse 2s infinite; }
    @keyframes pulse { 50% { opacity: .3; } }
    main { padding: 28px 32px; max-width: 1200px; margin: 0 auto; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; cursor: pointer; transition: border-color .2s; }
    .card.active { border-color: #3b82f6; }
    .card .sym { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .card .price { font-size: 26px; font-weight: 700; margin: 6px 0; font-variant-numeric: tabular-nums; }
    .card .chg { font-size: 14px; font-weight: 600; }
    .up { color: var(--up); } .down { color: var(--down); }
    .chart-wrap { margin-top: 24px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
    .chart-wrap h2 { margin: 0 0 12px; font-size: 16px; color: var(--muted); font-weight: 500; }
    canvas { max-height: 340px; }
    .err { color: var(--down); font-size: 13px; margin-top: 12px; }
    footer { text-align: center; color: var(--muted); font-size: 12px; padding: 24px; }
  </style>
</head>
<body>
  <header>
    <h1>📈 Ticker Board</h1>
    <div class="meta"><span class="dot"></span>Live · refreshes every 30s · last update <span id="updated">—</span></div>
  </header>

  <main>
    <div class="cards" id="cards"></div>
    <div class="chart-wrap">
      <h2 id="chartTitle">Session price history</h2>
      <canvas id="chart"></canvas>
    </div>
    <p class="err" id="err"></p>
  </main>

  <footer>Data from the CoinGecko public API · for information only, not financial advice · built by @ravi_dev</footer>

  <script>
    const COINS = [
      { id: "bitcoin", sym: "BTC", name: "Bitcoin" },
      { id: "ethereum", sym: "ETH", name: "Ethereum" },
      { id: "solana", sym: "SOL", name: "Solana" },
      { id: "cardano", sym: "ADA", name: "Cardano" },
      { id: "dogecoin", sym: "DOGE", name: "Dogecoin" },
    ];
    const REFRESH_MS = 30000;
    const history = Object.fromEntries(COINS.map(c => [c.id, []]));
    let selected = "bitcoin";

    const usd = (n) => n >= 1
      ? n.toLocaleString("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 2 })
      : "$" + n.toFixed(4);

    const chart = new Chart(document.getElementById("chart"), {
      type: "line",
      data: { labels: [], datasets: [{ data: [], borderColor: "#3b82f6", backgroundColor: "rgba(59,130,246,.12)", fill: true, tension: .35, pointRadius: 0 }] },
      options: {
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: "#8592a8", maxTicksLimit: 8 }, grid: { color: "#1e2738" } },
          y: { ticks: { color: "#8592a8" }, grid: { color: "#1e2738" } }
        },
        animation: { duration: 300 }
      }
    });

    function renderCards(data) {
      document.getElementById("cards").innerHTML = COINS.map(c => {
        const d = data[c.id];
        if (!d) return "";
        const ch = d.usd_24h_change ?? 0;
        return `<div class="card ${c.id === selected ? "active" : ""}" data-id="${c.id}">
          <div class="sym">${c.sym} · ${c.name}</div>
          <div class="price">${usd(d.usd)}</div>
          <div class="chg ${ch >= 0 ? "up" : "down"}">${ch >= 0 ? "▲" : "▼"} ${Math.abs(ch).toFixed(2)}% 24h</div>
        </div>`;
      }).join("");
    }

    function renderChart() {
      const pts = history[selected];
      const coin = COINS.find(c => c.id === selected);
      document.getElementById("chartTitle").textContent = `${coin.name} — price this session`;
      chart.data.labels = pts.map(p => p.t);
      chart.data.datasets[0].data = pts.map(p => p.v);
      chart.update();
    }

    async function refresh() {
      const url = `https://api.coingecko.com/api/v3/simple/price?ids=${COINS.map(c => c.id).join(",")}&vs_currencies=usd&include_24hr_change=true`;
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        const t = new Date().toLocaleTimeString();
        for (const c of COINS) if (data[c.id]) {
          history[c.id].push({ t, v: data[c.id].usd });
          if (history[c.id].length > 120) history[c.id].shift();
        }
        renderCards(data);
        renderChart();
        document.getElementById("updated").textContent = t;
        document.getElementById("err").textContent = "";
      } catch (e) {
        document.getElementById("err").textContent = "Couldn't reach CoinGecko (" + e.message + "). Retrying shortly.";
      }
    }

    document.getElementById("cards").addEventListener("click", (e) => {
      const card = e.target.closest(".card");
      if (!card) return;
      selected = card.dataset.id;
      document.querySelectorAll(".card").forEach(c => c.classList.toggle("active", c === card));
      renderChart();
    });

    refresh();
    setInterval(refresh, REFRESH_MS);
  </script>
</body>
</html>
