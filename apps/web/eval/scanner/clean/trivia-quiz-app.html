<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brainwave Trivia</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
</head>
<body class="bg-gradient-to-br from-fuchsia-600 to-indigo-700 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const QUESTIONS = [
      { q: "Which planet has the most moons as of 2024?", options: ["Jupiter", "Saturn", "Uranus", "Neptune"], answer: 1, category: "Space" },
      { q: "What is the smallest bone in the human body?", options: ["Stapes", "Incus", "Malleus", "Hyoid"], answer: 0, category: "Science" },
      { q: "In what year did the first iPhone go on sale?", options: ["2005", "2006", "2007", "2008"], answer: 2, category: "Tech" },
      { q: "Which country gifted the Statue of Liberty to the USA?", options: ["Spain", "United Kingdom", "Italy", "France"], answer: 3, category: "History" },
      { q: "What is the capital of Australia?", options: ["Sydney", "Canberra", "Melbourne", "Perth"], answer: 1, category: "Geography" },
      { q: "Who painted 'The Girl with a Pearl Earring'?", options: ["Rembrandt", "Vermeer", "Van Gogh", "Rubens"], answer: 1, category: "Art" },
      { q: "How many hearts does an octopus have?", options: ["One", "Two", "Three", "Four"], answer: 2, category: "Nature" },
      { q: "Which element has the chemical symbol 'K'?", options: ["Krypton", "Potassium", "Calcium", "Kalium-boron"], answer: 1, category: "Science" },
      { q: "What language has the most native speakers?", options: ["English", "Hindi", "Spanish", "Mandarin Chinese"], answer: 3, category: "Culture" },
      { q: "How long is a marathon, in kilometres (approx.)?", options: ["38.2", "40.0", "42.2", "45.1"], answer: 2, category: "Sport" },
    ];
    const SECONDS = 15;

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function ProgressBar({ value, max }) {
      return (
        <div className="h-2 bg-white/20 rounded-full overflow-hidden">
          <div className="h-full bg-amber-300 transition-all duration-300" style={{ width: `${(value / max) * 100}%` }} />
        </div>
      );
    }

    function StartScreen({ onStart, best }) {
      return (
        <div className="text-center text-white">
          <div className="text-6xl mb-4">🧠</div>
          <h1 className="text-4xl font-extrabold">Brainwave Trivia</h1>
          <p className="mt-3 text-white/80">10 questions · {SECONDS} seconds each · no googling 😉</p>
          {best > 0 && <p className="mt-2 text-amber-200">Your best: {best}/10</p>}
          <button onClick={onStart} className="mt-8 bg-amber-300 hover:bg-amber-200 text-indigo-900 font-bold px-10 py-3 rounded-full text-lg">Start quiz</button>
        </div>
      );
    }

    function Question({ item, index, total, onAnswer }) {
      const [picked, setPicked] = useState(null);
      const [timeLeft, setTimeLeft] = useState(SECONDS);

      useEffect(() => {
        if (picked !== null) return;
        if (timeLeft === 0) { setPicked(-1); return; }
        const t = setTimeout(() => setTimeLeft(s => s - 1), 1000);
        return () => clearTimeout(t);
      }, [timeLeft, picked]);

      useEffect(() => {
        if (picked === null) return;
        const t = setTimeout(() => onAnswer(picked === item.answer), 1200);
        return () => clearTimeout(t);
      }, [picked]);

      const style = (i) => {
        if (picked === null) return "bg-white hover:bg-indigo-50 text-indigo-900";
        if (i === item.answer) return "bg-emerald-400 text-white";
        if (i === picked) return "bg-rose-400 text-white";
        return "bg-white/60 text-indigo-900/60";
      };

      return (
        <div className="w-full max-w-xl">
          <div className="flex justify-between text-white/80 text-sm mb-2">
            <span>Question {index + 1} of {total} · {item.category}</span>
            <span className={timeLeft <= 5 ? "text-amber-300 font-bold" : ""}>⏱ {timeLeft}s</span>
          </div>
          <ProgressBar value={index} max={total} />
          <h2 className="text-2xl font-bold text-white mt-8 mb-6">{item.q}</h2>
          <div className="grid gap-3">
            {item.options.map((opt, i) => (
              <button key={i} disabled={picked !== null} onClick={() => setPicked(i)}
                className={`text-left px-5 py-4 rounded-xl font-medium shadow transition ${style(i)}`}>
                {opt}
              </button>
            ))}
          </div>
          {picked === -1 && <p className="text-amber-200 mt-4">Time's up!</p>}
        </div>
      );
    }

    function Results({ score, total, onRestart }) {
      const msg = score === total ? "Flawless! 🏆" : score >= 7 ? "Great job! 🎉" : score >= 4 ? "Not bad! 👍" : "Better luck next time 🙂";
      return (
        <div className="text-center text-white">
          <p className="text-lg text-white/80">You scored</p>
          <p className="text-7xl font-extrabold my-3">{score}<span className="text-3xl text-white/60">/{total}</span></p>
          <p className="text-2xl">{msg}</p>
          <button onClick={onRestart} className="mt-8 bg-white text-indigo-700 font-bold px-8 py-3 rounded-full">Play again</button>
        </div>
      );
    }

    function App() {
      const [stage, setStage] = useState("start");
      const [round, setRound] = useState(0);
      const [index, setIndex] = useState(0);
      const [score, setScore] = useState(0);
      const [best, setBest] = useState(() => Number(localStorage.getItem("brainwave.best") || 0));
      const questions = useMemo(() => shuffle(QUESTIONS), [round]);

      const handleAnswer = (correct) => {
        const next = score + (correct ? 1 : 0);
        setScore(next);
        if (index + 1 < questions.length) {
          setIndex(index + 1);
        } else {
          if (next > best) { setBest(next); localStorage.setItem("brainwave.best", next); }
          setStage("done");
        }
      };

      const start = () => { setRound(r => r + 1); setIndex(0); setScore(0); setStage("play"); };

      return (
        <main className="min-h-screen flex items-center justify-center p-6">
          {stage === "start" && <StartScreen onStart={start} best={best} />}
          {stage === "play" && <Question key={`${round}-${index}`} item={questions[index]} index={index} total={questions.length} onAnswer={handleAnswer} />}
          {stage === "done" && <Results score={score} total={questions.length} onRestart={start} />}
        </main>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
