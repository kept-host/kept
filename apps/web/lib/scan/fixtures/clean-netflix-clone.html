<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Netflix clone — UI practice</title><style>body{background:#000;color:#fff}</style></head>
<body>
  <header><h1>NETFLIX</h1><p>A UI clone built for practice. Nothing here is sent anywhere.</p></header>
  <main>
    <h2>Sign In</h2>
    <form onsubmit="event.preventDefault(); alert('This is only a demo.');">
      <input type="email" placeholder="Email or phone number">
      <input type="password" placeholder="Password">
      <button>Sign In</button>
    </form>
    <h2>Trending now</h2>
    <ul><li>Movie one</li><li>Movie two</li></ul>
  </main>
</body>
</html>
