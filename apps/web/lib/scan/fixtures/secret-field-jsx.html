<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Checkout</title></head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    function Checkout() {
      return (
        <section>
          <h2>Pay for your order</h2>
          <input name="cardNumber" placeholder="1234 5678 9012 3456" />
          <input aria-label="CVC" maxLength={4} />
          <button>Pay now</button>
        </section>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<Checkout />);
  </script>
</body>
</html>
