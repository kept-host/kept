# @kept/edge — Cloudflare Worker (serving data plane).
#
# This Worker serves published pages at `{slug}.kept.host` from R2 (files) + KV
# (manifest). It reads those two stores ONLY — never the control plane (apps/web),
# never Supabase. Real routing/serving logic lands in epic E0; task 004 ships an
# empty skeleton that returns a placeholder/404.
#
# BINDING CONTRACT (soft contract with task 005 + task 008 `.env.example`):
#   - R2 bucket binding:  KEPT_R2  → auto-kept-sites-dev (v1-active, region "auto")
#   - KV namespace binding: KEPT_KV → kept-manifest-dev
# An EU-residency bucket (eu-kept-sites-dev) also exists; its Worker binding
# (KEPT_R2_EU) is added in E8 when region="eu" routing activates — the v1 skeleton
# reads neither store yet (E0 wires reads), so it stays unbound here for now.

name = "kept-edge"
main = "src/index.ts"
compatibility_date = "2026-06-24"
compatibility_flags = ["nodejs_compat"]

# Serve every first-level subdomain of kept.host. Zone + wildcard DNS are
# provisioned in task 005; apex `kept.host` and `www`/`app`/`api`/`assets` route
# to the control plane, not here (reserved labels handled in E0).
# routes = [
#   { pattern = "*.kept.host/*", zone_name = "kept.host" }
# ]

# R2 bucket holding `sites/{siteId}/{versionId}/{path}` objects (default region).
[[r2_buckets]]
binding = "KEPT_R2"
bucket_name = "auto-kept-sites-dev"
# preview_bucket_name = "auto-kept-sites-preview"

# KV namespace holding the per-slug manifest (see @kept/shared KvManifest).
# Paste the "kept-manifest-dev" namespace ID below.
[[kv_namespaces]]
binding = "KEPT_KV"
id = "fd5c0c7fbd9147f4849f65d59cdcd14c"
# preview_id = "REPLACE_WITH_PREVIEW_KV_NAMESPACE_ID"

[observability]
enabled = true
